apiVersion: apps/v1
kind: Deployment
metadata:
  name: arjsdemo
  labels:
    app: arjsdemo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: arjsdemo
  template:
    metadata:
      labels:
        app: arjsdemo
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: arjsdemo
        image: aycelogic/arjs:latest
        imagePullPolicy: Always
        securityContext:
          capabilities:
            drop:
            - NET_RAW
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: arjsdemo-service
  labels:
    app: arjsdemo
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: arjsdemo
